baseURL: https://libregdpr.org/
locale: de-de
title: Open Source Privacy Information

defaultContentLanguage: de
languages:
  de:
    label: Deutsch
    weight: 1
    title: LibreGDPR
  #en:
    #label: English
    #weight: 2
    #title: Hextra

module:
  imports:
    - path: github.com/imfing/hextra

# Article URLs are decoupled from the content tree: the directory layout
# (chapter/article) drives the sidebar, the front matter slug drives the URL.
# Art. 32 stays at /dsgvo/art-32/ even if the tree is reorganised.
permalinks:
  page:
    dsgvo: /dsgvo/:slug/
    erwaegungsgruende: /erwaegungsgruende/:slug/

# Entscheidungen betreffen fast immer mehrere Artikel gleichzeitig. Sie werden
# deshalb einmal erfasst und ueber diese Taxonomie den Artikeln zugeordnet,
# statt sie pro Artikel zu wiederholen.
taxonomies:
  artikel: artikel

markup:
  goldmark:
    renderer:
      # Shortcodes wie abs/lit geben HTML aus, das anschliessend wieder durch
      # den Markdown-Renderer laeuft. Ohne unsafe wird es stillschweigend
      # verworfen. Inhalte stammen ausschliesslich aus diesem Repository.
      unsafe: true

menu:
  main:
    - name: DSGVO
      pageRef: /dsgvo
      weight: 1
    - name: Erwägungsgründe
      pageRef: /erwaegungsgruende
      weight: 2
    - name: Rechtsprechung
      pageRef: /rechtsprechung
      weight: 3
    - name: Blog
      pageRef: /blog
      weight: 4
    - name: Über das Projekt
      pageRef: /about
      weight: 5
    - name: Search
      weight: 6
      params:
        type: search
    - name: GitHub
      weight: 7
      url: "https://github.com/maxcodeshere/libregdpr"
      params:
        icon: github    
  sidebar:
    - name: Mehr
      params:
        type: separator
      weight: 1
    - name: "Hugo Docs ↗"
      pageRef: "https://gohugo.io/documentation/"
      weight: 2
    - name: "Mermaid Docs ↗"
      url: "https://mermaid.js.org/intro/"
      weight: 3

params:
  theme:
    # light | dark | system
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
    width: normal
  displayUpdatedDate: true
  dateFormat: "2. January 2006"
  editURL:
    enable: true
    base: "https://github.com/maxcodeshere/libregdpr/tree/main/content"
